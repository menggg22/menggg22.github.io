<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title></title>
  <link rel="icon" href="favicon.ico">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Georgia, serif;
      background: #FDFAF3;
      color: #2A2520;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .wrap { text-align: center; padding: 2rem; }
    h1 { font-size: 1.75rem; margin-bottom: 0.4rem; letter-spacing: 0.01em; }
    .sub {
      font-family: sans-serif;
      font-size: 0.9rem;
      color: #6B6560;
      margin-bottom: 1.5rem;
    }
    .scholar-link {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-family: sans-serif;
      font-size: 0.85rem;
      color: #6B6560;
      text-decoration: none;
      border-bottom: 1px solid rgba(107,101,96,0.3);
      padding-bottom: 1px;
      transition: color 0.2s, border-color 0.2s;
    }
    .scholar-link:hover { color: #2A2520; border-color: #2A2520; }
    .scholar-link svg { width: 16px; height: 16px; fill: currentColor; flex-shrink: 0; }
    .cursor {
      display: inline-block;
      animation: blink 1s step-end infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <p class="sub"><span id="typed"></span><span class="cursor">|</span></p>
  </div>
  <script>
    const text = 'On something else right now. Will be back soon.';
    const el = document.getElementById('typed');
    let i = 0;
    function type() {
      if (i < text.length) {
        el.textContent += text[i++];
        setTimeout(type, 60);
      }
    }
    setTimeout(type, 200);
  </script>
</body>
</html>
